<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Online Shopping</title>
<!-- เพิ่มฟอนต์ Prompt สำหรับภาษาไทย -->
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Syne:wght@400;500;600;700&family=Bricolage+Grotesque:wght@500;600;700;800&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* แทรกฟอนต์ Prompt เข้าไปเป็นฟอนต์หลักสำหรับภาษาไทย */
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Prompt', 'Syne', sans-serif; }
  body { background: #f6f3f8; color: #333; line-height: 1.6; }

  .topbar { background: #2c1b3d; padding: 1rem 5%; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  .topbar-left { display: flex; align-items: center; gap: 0.8rem; }
  .topbar-left svg { width: 26px; height: 26px; color: #d9a6ff; }
  .topbar-title { font-family: 'Bricolage Grotesque', 'Prompt', sans-serif; font-weight: 700; font-size: 1.15rem; color: #fff; }
  .topbar-badge { background: #d9a6ff; color: #2c1b3d; font-family: 'Archivo', 'Prompt', sans-serif; font-weight: 700; font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 999px; margin-left: 0.6rem; }
  .topbar-right { display: flex; align-items: center; gap: 1rem; }
  .topbar-user { color: #d9a6ff; font-family: 'Archivo', 'Prompt', sans-serif; font-size: 0.9rem; }
  .btn-logout {
    background: transparent; border: 1px solid #d9a6ff; color: #d9a6ff; padding: 0.5rem 1rem;
    border-radius: 6px; font-family: 'Prompt', 'Archivo', sans-serif; font-size: 0.88rem; cursor: pointer; transition: all 0.2s;
  }
  .btn-logout:hover { background: #d9a6ff; color: #2c1b3d; }
  .admin-main { max-width: 1200px; margin: 0 auto; padding: 2rem 5% 4rem; }
  .admin-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
  .admin-header h1 { font-family: 'Bricolage Grotesque', 'Prompt', sans-serif; font-size: 1.5rem; color: #2c1b3d; }
  
  .btn-primary {
    background: linear-gradient(90deg, #9c00b4, #e91e8c); color: #fff; border: none; padding: 0.75rem 1.4rem;
    border-radius: 8px; font-family: 'Prompt', 'Bricolage Grotesque', sans-serif; font-weight: 500; font-size: 0.95rem;
    cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.9; }
  .tabs { display: flex; gap: 0.6rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  .tab-btn {
    background: #fff; border: 1px solid #ddd; color: #666; padding: 0.5rem 1.1rem; border-radius: 999px;
    font-family: 'Prompt', 'Archivo', sans-serif; font-size: 0.88rem; cursor: pointer; transition: all 0.15s;
  }
  .tab-btn:hover { border-color: #ce93d8; }
  .tab-btn.active { background: #9c00b4; border-color: #9c00b4; color: #fff; font-weight: 500; }
  .table-wrap { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
  table { width: 100%; border-collapse: collapse; font-family: 'Prompt', 'Archivo', sans-serif; font-size: 0.92rem; }
  thead { background: #faf5fb; }
  th { text-align: left; padding: 0.9rem 1.2rem; color: #7b0094; font-weight: 600; font-size: 0.85rem; }
  td { padding: 0.9rem 1.2rem; border-top: 1px solid #f0f0f0; vertical-align: middle; }
  .col-icon { font-size: 1.4rem; width: 60px; text-align: center; }
  .col-actions { display: flex; gap: 0.5rem; }
  .cat-pill { background: #f0e6f0; color: #7b0094; padding: 0.2rem 0.7rem; border-radius: 999px; font-size: 0.78rem; font-weight: 500; }
  .btn-edit, .btn-delete {
    border: none; padding: 0.4rem 0.8rem; border-radius: 6px; font-family: 'Prompt', 'Archivo', sans-serif;
    font-size: 0.82rem; cursor: pointer; font-weight: 500; transition: opacity 0.2s;
  }
  .btn-edit { background: #e8f0fe; color: #1967d2; }
  .btn-delete { background: #fce8e6; color: #c5221f; }
  .btn-edit:hover, .btn-delete:hover { opacity: 0.75; }
  .empty-row td { text-align: center; color: #999; padding: 3rem; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    align-items: center; justify-content: center; z-index: 1000; padding: 1rem;
  }
  .modal-overlay.show { display: flex; }
  .modal-box { background: #fff; border-radius: 12px; padding: 2rem; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
  .modal-box h3 { font-family: 'Prompt', 'Bricolage Grotesque', sans-serif; color: #7b0094; font-size: 1.25rem; margin-bottom: 1.3rem; font-weight: 600; }
  
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-family: 'Prompt', 'Archivo', sans-serif; font-weight: 500; font-size: 0.9rem; color: #555; margin-bottom: 0.35rem; }
  
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #ddd; border-radius: 6px; 
    font-family: 'Prompt', 'Archivo', sans-serif;
    font-size: 0.95rem; outline: none; transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #9c00b4; }
  .form-group textarea { resize: vertical; min-height: 60px; }
  
  /* ตกแต่ง Dropdown เลือกหมวดหมู่ให้สวยขึ้น */
  .form-group select {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%24%2024%22%20fill%3D%22none%22%20stroke%3D%22%237b0094%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat;
    background-position: right 0.8rem center;
    background-size: 1rem;
    padding-right: 2.5rem;
    cursor: pointer;
  }

  .modal-actions { display: flex; gap: 0.8rem; margin-top: 1.3rem; }
  .btn-cancel-modal {
    flex: 1; padding: 0.7rem; border: 1px solid #ddd; background: #fff; border-radius: 8px;
    font-family: 'Prompt', 'Archivo', sans-serif; cursor: pointer; color: #666; font-weight: 500;
  }
  .btn-save { flex: 1; }
  .form-error { color: #c5221f; font-family: 'Prompt', 'Archivo', sans-serif; font-size: 0.85rem; margin-bottom: 0.8rem; display: none; }
  .form-error.show { display: block; }
  .toast {
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px);
    background: #333; color: #fff; padding: 0.8rem 1.5rem; border-radius: 8px; font-size: 0.9rem;
    font-family: 'Prompt', 'Archivo', sans-serif; z-index: 9999; opacity: 0; transition: all 0.3s ease; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.success { background: #059669; }
  .toast.error { background: #dc2626; }

  @media (max-width: 700px) {
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    td { display: flex; justify-content: space-between; align-items: center; border: none; padding: 0.5rem 1.2rem; }
    td::before { content: attr(data-label); font-weight: 600; color: #7b0094; font-size: 0.85rem; }
    tr { border-bottom: 1px solid #eee; padding: 0.6rem 0; }
    .col-actions { justify-content: flex-end; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
    </svg>
    <span class="topbar-title">ONLINE SHOPPING</span>
    <span class="topbar-badge">ADMIN</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-user" id="adminUserLabel"></span>
    <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
  </div>
</header>

<!-- ===== Main ===== -->
<main class="admin-main">
  <div class="admin-header">
    <h1>จัดการสินค้า</h1>
    <button class="btn-primary" onclick="openCategoryModal()" style="background:#5b3a82">จัดการหมวดหมู่</button>
    <button class="btn-primary" onclick="openAddModal()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      เพิ่มสินค้าใหม่
    </button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-cat="all" onclick="setFilter('all')">ทั้งหมด</button>
    <button class="tab-btn" data-cat="foryou" onclick="setFilter('foryou')">สินค้าทั่วไป</button>
    <button class="tab-btn" data-cat="trending" onclick="setFilter('trending')">Trending</button>
    <button class="tab-btn" data-cat="gamer" onclick="setFilter('gamer')">Gamer</button>
    <span id="dynamicCategoryTabs"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>ชื่อสินค้า</th>
          <th>หมวดหมู่</th>
          <th>ราคา</th>
          <th>การจัดการ</th>
        </tr>
      </thead>
      <tbody id="productTableBody">
        <tr class="empty-row"><td colspan="5">กำลังโหลดสินค้า...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div class="modal-overlay" id="categoryModalOverlay">
  <div class="modal-box">
    <h3>จัดการหมวดหมู่สินค้า</h3>
    <p style="font-size:0.9rem;color:#666;margin-bottom:1rem">เพิ่มหมวดหมู่ใหม่ได้จากตรงนี้</p>
    <div class="form-group"><label for="newCategoryName">ชื่อหมวดหมู่</label><input id="newCategoryName" type="text" placeholder="เช่น เสื้อผ้า"></div>
    <div class="modal-actions"><button type="button" class="btn-cancel-modal" onclick="closeCategoryModal()">ปิด</button><button type="button" class="btn-primary" onclick="addCategory()">เพิ่มหมวดหมู่</button></div>
    <div id="categoryList" style="margin-top:1.5rem"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle">เพิ่มสินค้าใหม่</h3>
    <p class="form-error" id="formError"></p>
    <form onsubmit="event.preventDefault(); submitProductForm();">
      <div class="form-group">
        <label for="f-name">ชื่อสินค้า</label>
        <input type="text" id="f-name" placeholder="เช่น Gaming Mouse X1" required>
      </div>
      <div class="form-group">
        <label for="f-category">หมวดหมู่</label>
        <select id="f-category" required></select>
      </div>
      <div class="form-group">
        <label for="f-price">ราคา ($)</label>
        <input type="number" id="f-price" step="0.01" min="0" placeholder="0.00" required>
      </div>
      <div class="form-group">
        <label for="f-icon">ไอคอน (อิโมจิ)</label>
        <input type="text" id="f-icon" placeholder="📦" maxlength="4">
      </div>
      <div class="form-group">
        <label for="f-image">ลิงก์รูปภาพ (ถ้ามี)</label>
        <input type="text" id="f-image" placeholder="https://... หรือชื่อไฟล์ เช่น mouse1.jpg">
      </div>
      <div class="form-group">
        <label for="f-desc">คำอธิบาย</label>
        <textarea id="f-desc" placeholder="รายละเอียดสินค้าโดยย่อ"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel-modal" onclick="closeModal()">ยกเลิก</button>
        <button type="submit" class="btn-primary btn-save" id="saveBtn">บันทึก</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var API_BASE = 'https://online-shopping-backend-vsh3.onrender.com/api'; // หรือเปลี่ยนเป็น http://localhost:3000/api หากทดสอบในเครื่อง
  var ADMIN_KEY = 'adminUser';
  var admin = null;
  try { admin = JSON.parse(localStorage.getItem(ADMIN_KEY) || 'null'); } catch (e) { admin = null; }
  if (!admin || admin.role !== 'admin') {
    window.location.href = 'admin-login.html';
  } else {
    document.getElementById('adminUserLabel').textContent = admin.username;
  }

  function logout() {
    localStorage.removeItem(ADMIN_KEY);
    window.location.href = 'admin-login.html';
  }

  var toastTimer;
  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (type || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, 2500);
  }

  var allProducts = [];
  var currentFilter = 'all';
  var editingId = null;
  var CAT_LABEL = { foryou: 'สินค้าทั่วไป', trending: 'Trending', gamer: 'Gamer' };

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  var categories = [];
  function loadCategories(){return fetch(API_BASE+'/categories').then(function(r){if(!r.ok)throw Error();return r.json();}).then(function(list){
    categories=list;
    document.getElementById('f-category').innerHTML=list.map(function(c){return '<option value="'+escapeHtml(c.key)+'">'+escapeHtml(c.name)+'</option>';}).join('');
    document.getElementById('dynamicCategoryTabs').innerHTML=list.filter(function(c){return !['foryou','trending','gamer'].includes(c.key);}).map(function(c){return '<button class="tab-btn" data-cat="'+escapeHtml(c.key)+'" onclick="setFilter(\''+escapeHtml(c.key)+'\')">'+escapeHtml(c.name)+'</button>';}).join('');
    renderCategoryList();
  });}
  
  function renderCategoryList(){
    var el=document.getElementById('categoryList');
    if(!el)return;
    el.innerHTML=categories.map(function(c){
      var locked=['foryou','trending','gamer'].includes(c.key);
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:0.75rem 0;border-top:1px solid #eee;font-size:0.95rem;"><span>'+escapeHtml(c.name)+'</span>'+(locked?'<span style="color:#aaa;font-size:0.85rem">หมวดหลัก</span>':'<button class="btn-delete" onclick="deleteCategory(\''+escapeHtml(c.key)+'\')">ลบ</button>')+'</div>';
    }).join('');
  }
  
  function openCategoryModal(){document.getElementById('newCategoryName').value='';document.getElementById('categoryModalOverlay').classList.add('show');loadCategories();}
  function closeCategoryModal(){document.getElementById('categoryModalOverlay').classList.remove('show');}
  
  function addCategory(){var name=document.getElementById('newCategoryName').value.trim();if(!name)return alert('กรุณาใส่ชื่อหมวดหมู่');fetch(API_BASE+'/categories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name})}).then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d};});}).then(function(x){if(!x.ok)return alert(x.data.error||'เพิ่มไม่สำเร็จ');loadCategories();loadProducts();showToast('เพิ่มหมวดหมู่เรียบร้อย','success');document.getElementById('newCategoryName').value='';}).catch(function(){alert('เชื่อมต่อ server ไม่ได้');});}
  
  function deleteCategory(key){if(!confirm('ต้องการลบหมวดหมู่นี้ใช่ไหม?'))return;fetch(API_BASE+'/categories/'+encodeURIComponent(key),{method:'DELETE'}).then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d};});}).then(function(x){if(!x.ok)return alert(x.data.error||'ลบไม่สำเร็จ');if(currentFilter===key)currentFilter='all';loadCategories();loadProducts();});}

  function loadProducts() {
    fetch(API_BASE + '/products/all')
      .then(function (res) {
        if (!res.ok) throw new Error('load failed');
        return res.json();
      })
      .then(function (data) {
        allProducts = data;
        renderTable();
      })
      .catch(function () {
        document.getElementById('productTableBody').innerHTML =
          '<tr class="empty-row"><td colspan="5">โหลดสินค้าไม่สำเร็จ ตรวจสอบว่ารัน backend อยู่</td></tr>';
      });
  }

  function renderTable() {
    var body = document.getElementById('productTableBody');
    var list = currentFilter === 'all' ? allProducts : allProducts.filter(function (p) { return p.category === currentFilter; });

    if (list.length === 0) {
      body.innerHTML = '<tr class="empty-row"><td colspan="5">ไม่มีสินค้าในหมวดนี้</td></tr>';
      return;
    }

    body.innerHTML = list.map(function (p) {
      var price = Number(p.price);
      return (
        '<tr>' +
          '<td class="col-icon" data-label="">' + escapeHtml(p.icon || '📦') + '</td>' +
          '<td data-label="ชื่อสินค้า">' + escapeHtml(p.name) + '</td>' +
          '<td data-label="หมวดหมู่"><span class="cat-pill">' + (CAT_LABEL[p.category] || escapeHtml(p.category)) + '</span></td>' +
          '<td data-label="ราคา">$' + (isNaN(price) ? '-' : price.toFixed(2)) + '</td>' +
          '<td data-label="การจัดการ">' +
            '<div class="col-actions">' +
              '<button class="btn-edit" onclick="openEditModal(\'' + p.id + '\')">แก้ไข</button>' +
              '<button class="btn-delete" onclick="deleteProduct(\'' + p.id + '\')">ลบ</button>' +
            '</div>' +
          '</td>' +
        '</tr>'
      );
    }).join('');
  }

  function setFilter(cat) {
    currentFilter = cat;
    document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-cat') === cat); });
    renderTable();
  }

  function openAddModal() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'เพิ่มสินค้าใหม่';
    document.getElementById('saveBtn').textContent = 'เพิ่มสินค้า';
    document.getElementById('f-name').value = '';
    document.getElementById('f-category').value = currentFilter !== 'all' ? currentFilter : 'foryou';
    document.getElementById('f-price').value = '';
    document.getElementById('f-icon').value = '';
    document.getElementById('f-image').value = '';
    document.getElementById('f-desc').value = '';
    hideFormError();
    document.getElementById('modalOverlay').classList.add('show');
  }

  function openEditModal(id) {
    var p = allProducts.find(function (item) { return item.id === id; });
    if (!p) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = 'แก้ไขสินค้า';
    document.getElementById('saveBtn').textContent = 'บันทึกการแก้ไข';
    document.getElementById('f-name').value = p.name || '';
    document.getElementById('f-category').value = p.category || 'foryou';
    document.getElementById('f-price').value = p.price != null ? p.price : '';
    document.getElementById('f-icon').value = p.icon || '';
    document.getElementById('f-image').value = p.image || '';
    document.getElementById('f-desc').value = p.desc || '';
    hideFormError();
    document.getElementById('modalOverlay').classList.add('show');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
  }

  function showFormError(msg) {
    var el = document.getElementById('formError');
    el.textContent = msg;
    el.classList.add('show');
  }
  function hideFormError() {
    document.getElementById('formError').classList.remove('show');
  }

  function submitProductForm() {
    var name = document.getElementById('f-name').value.trim();
    var category = document.getElementById('f-category').value;
    var price = document.getElementById('f-price').value;
    var icon = document.getElementById('f-icon').value.trim();
    var image = document.getElementById('f-image').value.trim();
    var desc = document.getElementById('f-desc').value.trim();

    if (!name || !category || price === '') {
      showFormError('กรุณากรอกชื่อสินค้า หมวดหมู่ และราคาให้ครบ');
      return;
    }
    hideFormError();

    var payload = { name: name, category: category, price: Number(price), icon: icon, image: image, desc: desc };
    var saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;

    var request = editingId
      ? fetch(API_BASE + '/products/' + editingId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
      : fetch(API_BASE + '/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

    request
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) {
          showFormError(result.data.error || 'บันทึกไม่สำเร็จ');
          return;
        }
        closeModal();
        showToast(editingId ? 'แก้ไขสินค้าเรียบร้อย' : 'เพิ่มสินค้าเรียบร้อย', 'success');
        loadProducts();
      })
      .catch(function () {
        showFormError('เชื่อมต่อ server ไม่ได้ ตรวจสอบว่ารัน backend อยู่');
      })
      .finally(function () {
        saveBtn.disabled = false;
      });
  }

  function deleteProduct(id) {
    if (!confirm('ต้องการลบสินค้านี้ใช่ไหม?')) return;
    fetch(API_BASE + '/products/' + id, { method: 'DELETE' })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) {
          showToast(result.data.error || 'ลบไม่สำเร็จ', 'error');
          return;
        }
        showToast('ลบสินค้าเรียบร้อย', 'success');
        loadProducts();
      })
      .catch(function () {
        showToast('เชื่อมต่อ server ไม่ได้', 'error');
      });
  }

  if (admin && admin.role === 'admin') {
    loadCategories().then(loadProducts).catch(loadProducts);
  }
</script>

</body>
</html>
